spring:
  application:
    name: harness-agent
  main:
    web-application-type: none
project:
  folder: /var/lib/harness
log:
  root:
    level: info
harness:
  agent:
    server-url: ${HARNESS_SERVER_URL}
    enrollment-url: ${HARNESS_ENROLLMENT_URL}
    enrollment-code: ${HARNESS_ENROLLMENT_CODE:}
    device-name: ${HARNESS_DEVICE_NAME:isolated-linux-agent}
    data-dir: /var/lib/harness/agent
    codex-command: /usr/local/bin/codex
    codex-request-timeout-seconds: 30
    strict-project-isolation: true
    max-workspaces: 1
    max-concurrent-turns: 1
    responses-history-compatibility: true
    workspace-roots:
      - name: isolated-project
        path: /workspaces
    workspaces: []

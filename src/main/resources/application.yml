spring:
  application:
    name: harness-agent
  main:
    web-application-type: none

project:
  folder: D:/a_Coder/WorkSpace/webSer/myApps/harness-agent

log:
  root:
    level: debug

harness:
  agent:
    server-url: ws://localhost:9010/ws/agent
    enrollment-url: http://localhost:9010/api/v1/agent/enroll
    device-code:
    device-token:
    enrollment-code: ENR-CEXG-EPUW
    device-name: jagger-device
    data-dir: ${project.folder}/.my-harness-agent
    # 设备级活动 Turn 上限，包含等待审批的 Turn；修改后需重启 Agent。
    # 多 Expert 编排由中台调度独立 Conversation，原生 multi_agent 继续由受控工具策略关闭。
    # 当前可写 Turn 在同 Workspace 内互斥；不同 Workspace 可并发，编排调度额度由中台配置。
    max-concurrent-turns: 4
    workspace-archive-max-files: 100
    workspace-archive-max-total-bytes: 104857600
    workspace-archive-max-output-bytes: 115343360
    heartbeat-interval-seconds: 15
    reconnect-max-delay-seconds: 30
    command-deduplication-size: 1000
    codex-command: codex
    responses-history-compatibility: true
    strict-project-isolation: true
    windows-sandbox: elevated
    windows-python: ${project.folder}/runtime/python/python.exe
    codex-request-timeout-seconds: 30
    skill-max-download-size-mb: 20
    skill-max-file-count: 500
    skill-max-single-file-size-mb: 20
    skill-max-expanded-size-mb: 100
    workspace-roots:
      - name: workspace-root
        path: ${project.folder}/workspaces
    workspaces: []
